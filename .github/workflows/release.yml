name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check packaging==25.0
      - name: Run source tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components tools tests
      - name: Build integration ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python tools/build_release.py
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: dist
      - name: Verify artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/release.json" >/dev/null; then
              mkdir -p "$RUNNER_TEMP/published"
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published" \
                --pattern homycloud_local.zip --pattern SHA256SUMS --pattern release-manifest.json
              (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS)
              cmp dist/SHA256SUMS "$RUNNER_TEMP/published/SHA256SUMS"
              echo "An identical release is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "HomyCloud $RELEASE_VERSION" \
              --notes-file dist/RELEASE_NOTES.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/homycloud_local.zip dist/SHA256SUMS dist/release-manifest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
